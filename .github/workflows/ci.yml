name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ── C# / .NET 10 ─────────────────────────────────────────────────────────────
  build-csharp:
    name: C# (.NET 10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AetherMedia.slnx

      - name: Build
        run: dotnet build AetherMedia.slnx --no-restore --configuration Release

      - name: Format check (dotnet format)
        continue-on-error: true
        run: dotnet format AetherMedia.slnx --verify-no-changes

      - name: Test
        run: dotnet test AetherMedia.slnx --no-build --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  # ── TypeScript / Node 20 ─────────────────────────────────────────────────────
  build-typescript:
    name: TypeScript (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install
        working-directory: typescript
        run: npm ci

      - name: Build
        working-directory: typescript
        run: npm run build

      - name: Format check (prettier)
        working-directory: typescript
        continue-on-error: true
        run: npx prettier --check "src/**/*.ts"

      - name: Test
        working-directory: typescript
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-test-results
          path: typescript/test-results/
          if-no-files-found: ignore

  # ── Python 3.12 ──────────────────────────────────────────────────────────────
  build-python:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Format check (black)
        working-directory: python
        continue-on-error: true
        run: |
          pip install black
          black --check aether_media/ tests/

      - name: Test
        working-directory: python
        run: pytest --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: python/test-results.xml
          if-no-files-found: ignore

  # ── Rust (stable) ────────────────────────────────────────────────────────────
  build-rust:
    name: Rust (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        working-directory: rust
        run: cargo build

      - name: Format check (rustfmt)
        working-directory: rust
        continue-on-error: true
        run: cargo fmt --check

      - name: Lint (clippy)
        working-directory: rust
        continue-on-error: true
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results
          path: rust/target/nextest/
          if-no-files-found: ignore

  # ── Go 1.22 ──────────────────────────────────────────────────────────────────
  build-go:
    name: Go 1.22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.mod

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Format check (gofmt)
        working-directory: go
        continue-on-error: true
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files: $unformatted"
            exit 1
          fi

      - name: Test
        working-directory: go
        run: go test ./...

      - name: Test (with artifact output)
        if: always()
        working-directory: go
        run: go test -json ./... > test-results.json || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-results
          path: go/test-results.json
          if-no-files-found: ignore

  # ── Kotlin / JVM 21 ──────────────────────────────────────────────────────────
  build-kotlin:
    name: Kotlin (JVM 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('kotlin/**/*.gradle*', 'kotlin/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        working-directory: kotlin
        run: chmod +x gradlew

      - name: Build and test
        working-directory: kotlin
        run: ./gradlew build test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-results
          path: kotlin/build/reports/tests/
          if-no-files-found: ignore

  # ── Swift (macOS) ────────────────────────────────────────────────────────────
  build-swift:
    name: Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: swift
        run: swift build

      - name: Test
        working-directory: swift
        run: swift test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-results
          path: swift/.build/
          if-no-files-found: ignore

  # ── C (GCC + CMake + libvlc-dev) ─────────────────────────────────────────────
  build-c:
    name: C (GCC + CMake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev cmake

      - name: Configure
        working-directory: c
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: c
        run: cmake --build build

      - name: Test
        working-directory: c
        run: ctest --test-dir build --output-on-failure

  # ── Android (Gradle assembleDebug) ───────────────────────────────────────────
  build-android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Assemble debug APK
        working-directory: android/media
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        working-directory: android/media
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/media/app/build/reports/tests/
          if-no-files-found: ignore

  # ── Cross-language wire format interop ───────────────────────────────────────
  cross-language:
    name: Cross-language wire format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.mod

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install Python models package
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Build TypeScript (required for round-trip import)
        working-directory: typescript
        run: npm ci && npm run build

      - name: Run cross-language interop tests
        run: bash tests/cross-language/run_all.sh
