[package]
name = "aethermesh-media"
version = "1.0.0"
edition = "2021"
description = "Rust implementation of Aether Media — decentralised social media player"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_feed"
harness = false
