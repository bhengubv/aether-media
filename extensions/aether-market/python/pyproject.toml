[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aethernet-market"
version = "1.0.0"
description = "PoV trust and offline commerce for the Aether protocol"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["aethernet_market"]
