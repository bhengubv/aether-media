[package]
name = "aether-space"
version = "1.0.0"
edition = "2021"
description = "Geo-pinned mesh noticeboards for the Aether protocol"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
